name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-legacy-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches the Gradle version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          GRADLE=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' mod/build.gradle.kts | head -1)
          if [ "$TAG" != "$GRADLE" ]; then
            echo "::error::Tag v$TAG does not match Gradle version $GRADLE in mod/build.gradle.kts"
            exit 1
          fi
          echo "Tag v$TAG matches Gradle version"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node (web UI is bundled into core resources)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Fabric 1.19 and 1.21.11 mods
        working-directory: mod
        run: ./gradlew :fabric-1.19:build :fabric-1.21.11:build --no-daemon

      - name: Verify the web UI is bundled in the jars
        working-directory: mod
        run: |
          for jar in fabric-1.19/build/libs/debugbridge-1.19-*[0-9].jar \
                     fabric-1.21.11/build/libs/debugbridge-1.21.11-*[0-9].jar; do
            unzip -p "$jar" 'META-INF/jars/core-*.jar' > /tmp/core-nested.jar
            unzip -l /tmp/core-nested.jar | grep -q 'webui/index.html' \
              || { echo "::error::$jar is missing the bundled web UI"; exit 1; }
            echo "$jar: web UI bundled"
          done

      - name: Upload 1.19 release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-fabric-1.19
          path: |
            mod/fabric-1.19/build/libs/debugbridge-1.19-*[0-9].jar
            !mod/fabric-1.19/build/libs/*-sources.jar
            !mod/fabric-1.19/build/libs/*-dev*.jar
            !mod/fabric-1.19/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Upload 1.21.11 release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-fabric-1.21.11
          path: |
            mod/fabric-1.21.11/build/libs/debugbridge-1.21.11-*[0-9].jar
            !mod/fabric-1.21.11/build/libs/*-sources.jar
            !mod/fabric-1.21.11/build/libs/*-dev*.jar
            !mod/fabric-1.21.11/build/libs/*-javadoc.jar
          if-no-files-found: error

  build-26-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node (web UI is bundled into core resources)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Fabric 26.x mods
        working-directory: mod
        run: ./gradlew :fabric-26.1:build :fabric-26.2-dev:build --no-daemon

      - name: Verify the web UI is bundled in the jars
        working-directory: mod
        run: |
          for jar in fabric-26.1/build/libs/debugbridge-26.1-*[0-9].jar \
                     fabric-26.2-dev/build/libs/debugbridge-26.2-*[0-9].jar; do
            unzip -p "$jar" 'META-INF/jars/core-*.jar' > /tmp/core-nested.jar
            unzip -l /tmp/core-nested.jar | grep -q 'webui/index.html' \
              || { echo "::error::$jar is missing the bundled web UI"; exit 1; }
            echo "$jar: web UI bundled"
          done

      - name: Upload 26.1 release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-fabric-26.1
          path: |
            mod/fabric-26.1/build/libs/debugbridge-26.1-*[0-9].jar
            !mod/fabric-26.1/build/libs/*-sources.jar
            !mod/fabric-26.1/build/libs/*-dev*.jar
            !mod/fabric-26.1/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Upload 26.2 release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-fabric-26.2
          path: |
            mod/fabric-26.2-dev/build/libs/debugbridge-26.2-*[0-9].jar
            !mod/fabric-26.2-dev/build/libs/*-sources.jar
            !mod/fabric-26.2-dev/build/libs/*-dev*.jar
            !mod/fabric-26.2-dev/build/libs/*-javadoc.jar
          if-no-files-found: error

  build-and-release:
    needs:
      - build-legacy-mods
      - build-26-x
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download 1.19 artifact
        uses: actions/download-artifact@v8
        with:
          name: release-fabric-1.19
          path: release-artifacts/fabric-1.19

      - name: Download 1.21.11 artifact
        uses: actions/download-artifact@v8
        with:
          name: release-fabric-1.21.11
          path: release-artifacts/fabric-1.21.11

      - name: Download 26.1 artifact
        uses: actions/download-artifact@v8
        with:
          name: release-fabric-26.1
          path: release-artifacts/fabric-26.1

      - name: Download 26.2 artifact
        uses: actions/download-artifact@v8
        with:
          name: release-fabric-26.2
          path: release-artifacts/fabric-26.2

      - name: Stage only the four official jars
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          mkdir -p release-upload
          expect() {
            local dest="$1"
            local src="$2"
            local minecraft="$3"
            if [ ! -f "$src" ]; then
              echo "::error::Missing expected release jar: $src"
              exit 1
            fi
            unzip -t "$src" >/dev/null
            python3 - "$src" "$dest" "$VERSION" "$minecraft" <<'PY'
          import json, sys, zipfile
          src, dest, version, minecraft = sys.argv[1:5]
          with zipfile.ZipFile(src) as zf:
              meta = json.loads(zf.read("fabric.mod.json"))
              if meta.get("id") != "debugbridge":
                  raise SystemExit(f"{src}: unexpected mod id {meta.get('id')!r}")
              if meta.get("version") != version:
                  raise SystemExit(f"{src}: version {meta.get('version')!r} != {version!r}")
              depends = meta.get("depends") or {}
              if depends.get("minecraft") != minecraft:
                  raise SystemExit(f"{src}: minecraft {depends.get('minecraft')!r} != {minecraft!r}")
              names = zf.namelist()
              for nested in (
                  f"META-INF/jars/core-{version}.jar",
                  "META-INF/jars/groovy-5.0.6.jar",
                  "META-INF/jars/Java-WebSocket-1.6.0.jar",
                  "META-INF/jars/gson-2.14.0.jar",
              ):
                  if nested not in names:
                      raise SystemExit(f"{src}: missing nested jar {nested}")
              with zf.open(f"META-INF/jars/core-{version}.jar") as nested:
                  with zipfile.ZipFile(nested) as core:
                      if "webui/index.html" not in core.namelist():
                          raise SystemExit(f"{src}: nested core is missing webui/index.html")
          print(f"{dest}: version={version} minecraft={minecraft}")
          PY
            cp "$src" "release-upload/$dest"
          }
          expect "debugbridge-1.19-${VERSION}.jar" "release-artifacts/fabric-1.19/debugbridge-1.19-${VERSION}.jar" "1.19.x"
          expect "debugbridge-1.21.11-${VERSION}.jar" "release-artifacts/fabric-1.21.11/debugbridge-1.21.11-${VERSION}.jar" "1.21.11"
          expect "debugbridge-26.1-${VERSION}.jar" "release-artifacts/fabric-26.1/debugbridge-26.1-${VERSION}.jar" "26.1"
          expect "debugbridge-26.2-${VERSION}.jar" "release-artifacts/fabric-26.2/debugbridge-26.2-${VERSION}.jar" "26.2"
          extra=$(find release-artifacts -type f -name '*.jar' \
            ! -name "debugbridge-1.19-${VERSION}.jar" \
            ! -name "debugbridge-1.21.11-${VERSION}.jar" \
            ! -name "debugbridge-26.1-${VERSION}.jar" \
            ! -name "debugbridge-26.2-${VERSION}.jar" -print)
          if [ -n "$extra" ]; then
            echo "::error::Unexpected extra jars would have been published:"
            echo "$extra"
            exit 1
          fi
          count=$(find release-upload -type f -name 'debugbridge-*-*.jar' | wc -l | tr -d ' ')
          if [ "$count" != "4" ]; then
            echo "::error::Expected exactly 4 staged jars, found $count"
            find release-upload -type f -print
            exit 1
          fi
          ls -l release-upload

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: DebugBridge v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-upload/debugbridge-1.19-${{ steps.version.outputs.VERSION }}.jar
            release-upload/debugbridge-1.21.11-${{ steps.version.outputs.VERSION }}.jar
            release-upload/debugbridge-26.1-${{ steps.version.outputs.VERSION }}.jar
            release-upload/debugbridge-26.2-${{ steps.version.outputs.VERSION }}.jar
          body: |
            ## DebugBridge v${{ steps.version.outputs.VERSION }}

            Groovy-Java bridge for Minecraft: a WebSocket REPL into the running client.

            ### Installation
            1. Install Fabric Loader for your Minecraft version
            2. Drop the appropriate JAR into your `mods` folder
            3. Launch the game — you'll see a developer warning on first run
            4. After accepting, the bundled web UI is at http://localhost:9976
               (the in-game startup message prints the exact URL)

            ### Release artifacts
            This release publishes the same DebugBridge
            ${{ steps.version.outputs.VERSION }} feature line for every
            maintained Minecraft target. Choose the jar whose Minecraft version
            matches the instance exactly.

            - `debugbridge-1.19-*.jar` — legacy Minecraft 1.19 support
            - `debugbridge-1.21.11-*.jar` — Minecraft 1.21.11 support
            - `debugbridge-26.1-*.jar` — exact Minecraft 26.1 support
            - `debugbridge-26.2-*.jar` — stable 26.2 line

            ### New Minecraft lines
            - Adds a complete exact-26.1 bridge, including native entity,
              block, screenshot, recording, session-control, and GPU-backed
              item-texture providers.
            - Promotes the former 26.2 development module to stable Minecraft
              26.2, with exact metadata and stable rendering/API targets.

            ### Safer recordings
            - `record_video` now uses temporary storage by default with a
              24-hour TTL and automatic cleanup.
            - Set `storage: "persistent"` to keep captures under
              `<gameDir>/debugbridge-recordings/`.
            - Recording payloads now receive strict, centralized validation;
              response metadata reports storage, directory, and expiry.

            ### Reliability and hardening
            - `runCommand` keeps the same opt-in wire contract but now uses a
              native per-version provider instead of a Groovy round-trip.
            - Configuration values are deserialized and range-validated before
              use, while the legacy `lua` config block remains supported.
            - Object references are bounded, script execution reuses its worker,
              mapping search avoids redundant passes, and errors are formatted
              consistently without leaking unnecessary Java internals.
            - Recording lifecycle, disconnect errors, texture-provider cleanup,
              and entity/equipment refresh races are handled more defensively.

            ### Web UI
            - Improves inventory slot/component rendering and extracted the
              repeated slot presentation into a shared component.
            - Adds renderer-fallback indicators and fixes entity texture/status
              races and stale timers.
            - Adds unit coverage for bridge services and entity/block stores.

            ### Compatibility
            - The endpoint set and Groovy 5 scripting model remain compatible
              with v2.0.0.
            - Existing opt-in gates for `runCommand` and session control remain
              disabled by default.

            ### Supported Versions
            - Minecraft 1.19 (Fabric Loader >= 0.14.0)
            - Minecraft 1.21.11 (Fabric Loader >= 0.16.0)
            - Minecraft 26.1 exact (Fabric Loader >= 0.19.2)
            - Minecraft 26.2 stable (Fabric Loader >= 0.19.2)
